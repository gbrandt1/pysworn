[project]
name = "pysworn-repl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Gerhard Brandt", email = "gbrandt@cern.ch" }]
requires-python = ">=3.14"
dependencies = [
    "pygments>=2.19.2",
    "pysworn-common",
    "pysworn-renderables",
    "textual-autocomplete>=4.0.6",
]
[project.scripts]
sworn = "pysworn.repl.sworn:app"

[project.entry-points."pygments.styles"]
pysworn = "pysworn.repl.style:PyswornStyle"


[tool.uv.build-backend]
module-name = "pysworn.repl"

[tool.uv.sources]
pysworn-common = { workspace = true }
pysworn-renderables = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["textual-dev>=1.8.0"]

