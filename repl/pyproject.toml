[project]
name = "repl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Gerhard Brandt", email = "gbrandt@cern.ch" }]
requires-python = ">=3.14"
dependencies = [
    "pygments>=2.19.2",
    "pysworn-common",
    "pysworn-renderables",
    "textual-autocomplete>=4.0.6",
]
scripts = { sworn = "pysworn.repl.sworn:app" }

[project.entry-points."pygments.styles"]
pysworn = "pysworn.repl.style:PyswornStyle"


[tool.uv.build-backend]
module-name = "pysworn.repl"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["textual-dev>=1.8.0"]

[tool.uv.sources]
pysworn-common = { workspace = true }
pysworn-renderables = { workspace = true, editable = true }
