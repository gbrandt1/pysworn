[project]
name = "pysworn-common"
version = "0.1.0"
description = "PySworn Common Package"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasworn-classic",
    "datasworn-community-content-ancient-wonders",
    "datasworn-community-content-fe-runners",
    "datasworn-community-content-ironsmith",
    "datasworn-community-content-starsmith",
    "datasworn-core",
    "datasworn-delve",
    "datasworn-lodestar",
    "datasworn-starforged",
    "datasworn-sundered-isles",
    "rich>=14.2.0",
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "pysworn.common"


[tool.uv.sources]
datasworn-core = { git = "https://github.com/gbrandt1/datasworn.git/", subdirectory = "pkg/python/datasworn/src/datasworn/core" }
datasworn-classic = { git = "https://github.com/gbrandt1/datasworn.git/", subdirectory = "pkg/python/datasworn/src/datasworn/classic" }
datasworn-delve = { git = "https://github.com/gbrandt1/datasworn.git/", subdirectory = "pkg/python/datasworn/src/datasworn/delve" }
datasworn-lodestar = { git = "https://github.com/gbrandt1/datasworn.git/", subdirectory = "pkg/python/datasworn/src/datasworn/lodestar" }
datasworn-starforged = { git = "https://github.com/gbrandt1/datasworn.git/", subdirectory = "pkg/python/datasworn/src/datasworn/starforged" }
datasworn-sundered-isles = { git = "https://github.com/gbrandt1/datasworn.git/", subdirectory = "pkg/python/datasworn/src/datasworn/sundered_isles" }
datasworn-community-content-ancient-wonders = { git = "https://github.com/gbrandt1/datasworn.git/", subdirectory = "pkg/python/datasworn-community-content/src/datasworn_community_content/ancient-wonders" }
datasworn-community-content-fe-runners = { git = "https://github.com/gbrandt1/datasworn.git/", subdirectory = "pkg/python/datasworn-community-content/src/datasworn_community_content/fe-runners" }
datasworn-community-content-ironsmith = { git = "https://github.com/gbrandt1/datasworn.git/", subdirectory = "pkg/python/datasworn-community-content/src/datasworn_community_content/ironsmith" }
datasworn-community-content-starsmith = { git = "https://github.com/gbrandt1/datasworn.git/", subdirectory = "pkg/python/datasworn-community-content/src/datasworn_community_content/starsmith" }
